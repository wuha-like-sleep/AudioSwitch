name: Build Windows installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          PROJECT_REPOSITORY: ${{ github.repository }}
        run: ./build.ps1 -Runtime ${{ matrix.runtime }} -Repository $env:PROJECT_REPOSITORY
      - name: Installer smoke test
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./tests/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AudioSwitch-Setup-${{ matrix.runtime }}
          path: artifacts/installer/AudioSwitch-Setup-${{ matrix.runtime }}.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'win-x64'
        with:
          name: Settings-preview
          path: artifacts/settings-preview.png
          if-no-files-found: error
